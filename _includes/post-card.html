<article class="post-card" data-search="{{ include.post.title | downcase | escape }} {{ include.post.excerpt | strip_html | downcase | escape }} {{ include.post.content | strip_html | downcase | escape }} {{ include.post.categories | join: ' ' | downcase | escape }} {{ include.post.tags | join: ' ' | downcase | escape }}">
  <a class="post-card__link" href="{{ include.post.url | relative_url }}"><span class="post-card__number">{{ include.index | prepend: '000' | slice: -3, 3 }}</span><div class="post-card__main"><div class="post-card__meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%d.%m.%Y' }}</time><span>{{ include.post.categories.first | default: 'Geral' | escape }}</span></div><h3>{{ include.post.title | escape }}</h3><p>{{ include.post.excerpt | strip_html | strip | escape }}</p></div><span class="post-card__arrow" aria-hidden="true">↗</span></a>
</article>
