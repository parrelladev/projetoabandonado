title: Projeto Abandonado
description: Bem-vinde ao meu espaço internético para desabafar. Aqui eu narro pesares do cotidiano e registro minha vida.</p><p>Como o nome sugere, eu só publico aqui ocasionalmente. Meu blog não coleta dados de navegação, então sinta-se livre pra xeretar e acompanhar alguns recortes da minha vida.
lang: pt-BR
locale: pt_BR
timezone: America/Sao_Paulo
url: https://parrelladev.github.io
baseurl: /projetoabandonado
logo: /assets/images/og-cover.svg
twitter:
  card: summary_large_image
social:
  name: Projeto Abandonado
author:
  name: Projeto Abandonado
  bio: Um arquivo pessoal de ideias e transmissões.
  url: ""
markdown: kramdown
permalink: /posts/:year/:month/:day/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/images/og-cover.svg
      comments: false
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - cms/
  - README.md
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - vendor
  - .venv
  - venv
  - node_modules
  - __pycache__
  - .github
